name: Build Android APK

# 云端打包 Kivy 安卓 APK，本机不需要任何安卓环境。
# 仓库结构要求（本仓库就是按这个结构排的）：
#   .github/workflows/android-build.yml   ← 本文件
#   mobile/                               ← Kivy 应用（buildozer.spec 所在目录）
#   pages.py / browse.py                  ← 共享模块，构建时复制进 mobile/vendor/
# 触发：push 到 main/master，或在 Actions 页面手动 Run workflow。
# 产物：Actions → 本次运行 → Artifacts → ehreader-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    # 故意不加 paths 过滤：本仓库就是应用本体，任何 push 都该构建。
    # （加了 paths 时，强推/替换历史那种 push GitHub 算不出变动文件列表，
    #   会判定「没有匹配改动」而静默不触发。）

# 同一分支只保留最新一次构建，避免重复排队
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    # 22.04：python-for-android 2024.01.21 在 22.04 上验证最充分；
    # latest 已迁到 24.04，gcc/autoconf 版本差异容易让老 recipe 编译失败
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # python-for-android 要下 Android SDK/NDK（约 5~6 GB），先腾地方
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev libbz2-dev libsqlite3-dev libreadline-dev \
            libgdbm-dev liblzma-dev uuid-dev libjpeg-dev libpng-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          # Cython 固定在 0.29.x：buildozer 1.5 默认拉的 python-for-android 2024.01.21
          # 的 pyjnius 等 recipe 在 Cython 3 下会编译失败
          pip install buildozer "cython==0.29.36"

      - name: Cache buildozer global + app dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          key: buildozer-${{ runner.os }}-py311-${{ hashFiles('mobile/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-py311-
            buildozer-${{ runner.os }}-

      - name: Prepare vendor sources
        run: |
          cd mobile
          mkdir -p vendor
          cp -f ../pages.py ../browse.py vendor/
          ls -1 vendor/

      - name: Syntax check
        run: |
          cd mobile
          python -m py_compile ehapi.py mobui.py main.py selftest.py

      - name: Build debug APK
        run: |
          set -o pipefail
          cd mobile
          # android.accept_sdk_license = True 已写在 buildozer.spec 里，
          # 否则 CI 中 SDK 许可交互会让构建卡住
          buildozer -v android debug 2>&1 | tee ../buildozer.log

      # 失败时把日志尾部打成 annotation。
      # 原因：GitHub 的 job 日志接口（/actions/jobs/{id}/logs）必须登录才能读，
      # 但 check-runs 的 annotations 对公开仓库是免登录可读的 —— 这样无人值守时
      # 也能直接定位到真实报错。
      - name: Report failure tail
        if: failure()
        run: |
          echo "===== 环境 ====="
          python -V || true
          pip -V || true
          grep -n -i -E "python-for-android|Recommended NDK|p4a version" buildozer.log | head -n 5 || true
          echo "===== 第一个 Traceback 及其上下文 ====="
          grep -n -A 25 -m 1 "Traceback (most recent call last)" buildozer.log || true
          echo "===== 末尾 50 行 ====="
          tail -n 50 buildozer.log || true
          # 打成 annotation：GitHub 的 job 日志接口必须登录才能读，
          # 但 check-runs 的 annotations 对公开仓库免登录可读。
          tb=$(grep -A 25 -m 1 "Traceback (most recent call last)" buildozer.log 2>/dev/null | tr '\n' '~' | tr -d '\r' | cut -c1-6000)
          tail_msg=$(tail -n 30 buildozer.log 2>/dev/null | tr '\n' '~' | tr -d '\r' | cut -c1-6000)
          err_msg=$(grep -i -E "error|failed|fatal|exception|cannot|no such file|not found" buildozer.log 2>/dev/null | tail -n 20 | tr '\n' '~' | tr -d '\r' | cut -c1-6000)
          echo "::error title=BUILD_TRACEBACK::$tb"
          echo "::error title=BUILD_TAIL::$tail_msg"
          echo "::error title=BUILD_ERRORS::$err_msg"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Show APK
        run: ls -lh mobile/bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ehreader-apk
          path: mobile/bin/*.apk
          if-no-files-found: error
